[package]
name = "talon"
version = "0.1.0"
edition = "2021"

[features]
bazel = []
aws = ["dep:aws-sdk-dynamodb", "dep:aws-sdk-scheduler", "dep:aws-sdk-sqs"]
cpu-profile = ["dep:pprof"]
heap-profile = [
    "dep:tikv-jemallocator",
    "tikv-jemallocator/profiling",
    "dep:tikv-jemalloc-ctl",
    "tikv-jemalloc-ctl/profiling",
    "tikv-jemalloc-ctl/stats",
]
rocksdb = ["dep:rocksdb"]

[dependencies]
aead = "0.5"
aes-gcm = "0.10"
anyhow = "1.0"
async-trait = "0.1"
async-stream = "0.3"
base64 = "0.21"
bollard = "0.20"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.12"
jsonwebtoken = { version = "11.0", features = ["rust_crypto"] }
futures = "0.3"
flate2 = "1.1"
zstd = "0.13"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "service"] }
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = "0.32"
pprof = { version = "0.15", features = ["flamegraph"], optional = true }
tikv-jemallocator = { version = "0.7", optional = true }
tikv-jemalloc-ctl = { version = "0.7", optional = true }
redb = "1.0"
rocksdb = { version = "0.24", default-features = false, features = ["lz4"], optional = true }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Azure's generated clients expose a reqwest transport but default to native
# TLS. Enable that transport without native TLS, then select reqwest 0.13's
# rustls-backed default TLS implementation explicitly.
reqwest_azure = { package = "reqwest", version = "0.13.2", default-features = false, features = ["default-tls"] }
# rand 0.10 coexists with older workspace rand versions, so crate_universe emits
# a versioned alias; keep talon/BUILD.bazel on @crates//:rand-0.10.1.
rand = "0.10"
rmcp = { version = "1.8", features = ["client", "server", "macros", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
prost = "0.13"
prost-types = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sse-stream = "0.2"
tempfile = "3.0"
urlencoding = "2.1"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.20"
tracing = "0.1"
# 0.33 tracks opentelemetry 0.32; 0.32.x requires opentelemetry 0.31.
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tonic = { version = "0.12.3", features = ["tls-webpki-roots"] }
tonic-web = "0.12.3"
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors"] }
toml = "0.8"
serde_yaml = "0.9"
minijinja = { version = "=2.19.0", features = ["unstable_machinery"] }
mime_guess = "2"
monty-pool = "0.0.21"
monty-types = "0.0.21"
url = "2"
google-cloud-secretmanager-v1 = "1.7"
google-cloud-auth = "1.8"
aws-config = "1.8"
aws-sdk-dynamodb = { version = "1.103", optional = true }
aws-sdk-scheduler = { version = "=1.102.0", optional = true }
aws-sdk-s3 = "1.103"
aws-sdk-secretsmanager = "1.103"
aws-sdk-sqs = { version = "1.102", optional = true }
azure_core = { version = "0.33", default-features = false, features = ["reqwest", "reqwest_deflate", "reqwest_gzip", "tokio"] }
azure_identity = { version = "0.33", default-features = false }
azure_security_keyvault_secrets = { version = "0.12", default-features = false }
uuid = { version = "1.23.0", features = ["v7"] }
sqlx = { version = "0.8.6", features = ["postgres", "sqlite", "runtime-tokio"] }
google-cloud-pubsub = { version = "0.25.0", default-features = false, features = ["auth", "rustls-tls"] }
google-cloud-googleapis = { version = "0.13.0", features = ["pubsub"] }
clap = { version = "4.6.0", features = ["derive"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7.18"
talon-client = { path = "sdk/rust/talon-client" }

[build-dependencies]
prost-build = "0.13"
tonic-build = "0.12.3"
protoc-gen-prost = "0.4.0"
protoc-gen-tonic = "0.4.0"

[dev-dependencies]
aws-smithy-runtime-api = "1.11"
aws-smithy-types = "1.4"
tokio = { version = "1.0", features = ["test-util"] }

[[bin]]
name = "talon-server"
path = "src/bin/server.rs"

[[bin]]
name = "talon-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "talon-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "talon-node"
path = "src/bin/node.rs"

# Deterministic ACP fixture used by Rust and Python e2e tests. It remains an
# explicit bin target so Cargo exposes CARGO_BIN_EXE_talon-mock-acp to tests.
[[bin]]
name = "talon-mock-acp"
path = "tests/fixtures/mock_acp.rs"
