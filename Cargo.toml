[package]
name = "talon"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "crates/auth",
    "crates/bootstrap",
    "crates/cli",
    "crates/config",
    "crates/connectors",
    "crates/contracts",
    "crates/control",
    "crates/fanout",
    "crates/gateway",
    "crates/harness",
    "crates/identifiers",
    "crates/monty",
    "crates/observability",
    "crates/protocol",
    "crates/sandbox",
    "crates/security",
    "crates/session-control",
    "crates/storage/cloud-tasks",
    "crates/storage/common",
    "crates/storage/dynamodb",
    "crates/storage/eventbridge",
    "crates/storage/memory",
    "crates/storage/objects",
    "crates/storage/postgres",
    "crates/storage/pubsub",
    "crates/storage/rocksdb",
    "crates/storage/sqlite",
    "crates/storage/sqs",
    "crates/test-support",
    "crates/worker",
    "crates/workflows",
    "tools/bazel",
    "tools/install-hooks",
]
default-members = ["."]
resolver = "2"

[features]
aws = ["bootstrap/aws", "dep:storage-eventbridge", "dep:storage-sqs", "dep:storage-dynamodb", "dep:aws-sdk-sqs"]
cpu-profile = ["observability/cpu-profile"]
heap-profile = ["observability/heap-profile", "dep:tikv-jemallocator", "tikv-jemallocator/profiling"]
rocksdb = ["bootstrap/rocksdb", "dep:storage-rocksdb"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
aws-sdk-sqs = { version = "1.102", optional = true }
axum = { version = "0.7", features = ["ws"] }
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
google-cloud-pubsub = { version = "0.25.0", default-features = false, features = ["auth", "rustls-tls"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "service"] }
monty-pool = "0.0.21"
monty-types = "0.0.21"
prost = "0.13"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.0"
tikv-jemallocator = { version = "0.7", optional = true }
tokio = { version = "1.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tonic = { version = "0.12.3", features = ["tls-webpki-roots"] }
tower = "0.5"
tracing = "0.1"
url = "2"
urlencoding = "2.1"

# Legacy facade exports and executable composition.
auth = { path = "crates/auth" }
bootstrap = { path = "crates/bootstrap" }
cli = { path = "crates/cli" }
talon-client = { path = "sdk/rust/talon-client" }
config = { path = "crates/config" }
connectors = { path = "crates/connectors" }
contracts = { path = "crates/contracts" }
control = { path = "crates/control" }
fanout = { path = "crates/fanout" }
gateway = { path = "crates/gateway" }
harness = { path = "crates/harness" }
identifiers = { path = "crates/identifiers" }
monty = { path = "crates/monty" }
observability = { path = "crates/observability" }
protocol = { path = "crates/protocol" }
sandbox = { path = "crates/sandbox" }
security = { path = "crates/security" }
session-control = { path = "crates/session-control" }
storage-cloud-tasks = { path = "crates/storage/cloud-tasks" }
storage-common = { path = "crates/storage/common" }
storage-dynamodb = { path = "crates/storage/dynamodb", optional = true }
storage-eventbridge = { path = "crates/storage/eventbridge", optional = true }
storage-memory = { path = "crates/storage/memory" }
storage-objects = { path = "crates/storage/objects" }
storage-postgres = { path = "crates/storage/postgres" }
storage-pubsub = { path = "crates/storage/pubsub" }
storage-rocksdb = { path = "crates/storage/rocksdb", optional = true }
storage-sqlite = { path = "crates/storage/sqlite" }
storage-sqs = { path = "crates/storage/sqs", optional = true }
test-support = { path = "crates/test-support" }
worker = { path = "crates/worker" }
workflows = { path = "crates/workflows" }

[dev-dependencies]
aws-smithy-runtime-api = "1.11"
aws-smithy-types = "1.4"
rcgen = "0.13"
time = "0.3"
tokio = { version = "1.0", features = ["test-util"] }
tokio-rustls = "0.26"

[[bin]]
name = "talon-server"
path = "src/bin/server.rs"

[[bin]]
name = "talon-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "talon-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "talon-node"
path = "src/bin/node.rs"

# Deterministic ACP fixture used by Rust and Python e2e tests. It remains an
# explicit bin target so Cargo exposes CARGO_BIN_EXE_talon-mock-acp to tests.
[[bin]]
name = "talon-mock-acp"
path = "tests/fixtures/mock_acp.rs"
