name: Talon Chat Chromatic
concurrency:
  group: talon-chat-chromatic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromatic:
    name: Publish Storybook
    runs-on: ubuntu-24.04
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: ./.github/actions/setup-bazel
      with:
        buildbuddy-api-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.BUILDBUDDY_API_KEY
          || '' }}
    - name: Build Storybook
      run: |-
        bazel build //packages/talon-chat:storybook
        cp -R bazel-bin/packages/talon-chat/storybook-static packages/talon-chat/storybook-static
    - name: Skip Chromatic without project token
      if: env.CHROMATIC_PROJECT_TOKEN == ''
      run: echo "CHROMATIC_PROJECT_TOKEN is not configured; skipping Chromatic."
    - name: Run Chromatic
      if: env.CHROMATIC_PROJECT_TOKEN != ''
      uses: chromaui/action@latest
      with:
        projectToken: ${{ env.CHROMATIC_PROJECT_TOKEN }}
        workingDir: packages/talon-chat
        storybookBuildDir: storybook-static
'on':
  pull_request:
    paths:
    - packages/talon-chat/**
    - pnpm-lock.yaml
    - .github/workflows/talon-chat-chromatic.yml
  push:
    branches:
    - main
    paths:
    - packages/talon-chat/**
    - pnpm-lock.yaml
    - .github/workflows/talon-chat-chromatic.yml
