name: BuildBuddy Linux pilot comparison

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-linux:
    name: GitHub Linux pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          repository-cache: true
          # Pilot compiler flags must have their own reusable baseline outputs.
          # This workflow is the sole writer of this experimental bucket.
          disk-cache: talon-linux-pilot
          cache-save: true
      - name: Configure pilot cache access
        shell: bash
        env:
          # Only main pushes and maintainer-triggered manual runs reach here.
          PILOT_CACHE_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$PILOT_CACHE_KEY" ]]; then
            echo 'Pilot requires the existing BUILDBUDDY_API_KEY secret.'
            exit 1
          fi
          umask 077
          printf 'build --remote_header=x-buildbuddy-api-key=%s\nbuild --bes_header=x-buildbuddy-api-key=%s\n' \
            "$PILOT_CACHE_KEY" "$PILOT_CACHE_KEY" > .bazelrc.local
      - name: Install matching native prerequisites
        run: |
          echo "PILOT_SETUP_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          bash scripts/ci/linux-pilot-setup.sh
      - name: Measure initial and warm build/test invocations
        run: python3 scripts/ci/linux_pilot.py run --provider github --output "$RUNNER_TEMP/linux-pilot"
      - name: Upload pilot measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-pilot-github-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-pilot/
          if-no-files-found: warn
          retention-days: 30
