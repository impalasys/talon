name: Talon OSS CI
concurrency:
  group: talon-oss-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  bazel:
    name: Bazel
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-bazel
      with:
        buildbuddy-api-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.BUILDBUDDY_API_KEY
          || '' }}
    - name: Build and test all unit targets
      run: bazel test //...
  runtime_image:
    name: Runtime Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-bazel
      with:
        buildbuddy-api-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.BUILDBUDDY_API_KEY
          || '' }}
    - name: Log in to GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and publish OCI image
      run: |
        bazel build //dockerfiles:runtime
        if [[ "$PUBLISH_IMAGE" == "true" ]]; then
          bazel run //dockerfiles:runtime_push -- --tag latest --tag "sha-${GITHUB_SHA}"
        fi
        bazel run //dockerfiles:runtime_image
        docker run --rm talon-runtime:dev sh -ec 'talon-cli --help >/dev/null; python3 -c "import pytest, grpc, boto3"; monty --help >/dev/null; docker --version; curl --version'
      env:
        PUBLISH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  acp_harness_image:
    name: ACP Harness Sandbox Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-bazel
      with:
        buildbuddy-api-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.BUILDBUDDY_API_KEY
          || '' }}
    - uses: docker/setup-buildx-action@v4
    - name: Log in to GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Package Bazel-built image
      run: |
        options=()
        if [[ "$PUBLISH_IMAGE" == "true" ]]; then options+=(--push); fi
        bazel run //dockerfiles:acp_image -- "${options[@]}" \
          --tag "ghcr.io/impalasys/talon-acp-harness:latest" \
          --tag "ghcr.io/impalasys/talon-acp-harness:sha-${{ github.sha }}" \
          --tag "ghcr.io/impalasys/talon-codex-acp:latest" \
          --tag "ghcr.io/impalasys/talon-codex-acp:sha-${{ github.sha }}" \
          --tag "ghcr.io/impalasys/talon-claude-code-acp:latest" \
          --tag "ghcr.io/impalasys/talon-claude-code-acp:sha-${{ github.sha }}" \
          --tag "ghcr.io/impalasys/talon-opencode-acp:latest" \
          --tag "ghcr.io/impalasys/talon-opencode-acp:sha-${{ github.sha }}" \
          --cache-from type=gha,scope=talon-acp-harness \
          --cache-to type=gha,mode=max,scope=talon-acp-harness
      env:
        PUBLISH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  ui:
    name: UI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-bazel
      with:
        buildbuddy-api-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.BUILDBUDDY_API_KEY
          || '' }}
    - name: Log in to GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and publish OCI image
      run: |
        bazel build //dockerfiles:ui
        if [[ "$PUBLISH_IMAGE" == "true" ]]; then
          bazel run //dockerfiles:ui_push -- --tag latest --tag "sha-${GITHUB_SHA}"
        fi
      env:
        PUBLISH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  sightline_e2e_screenshots:
    name: Sightline E2E Screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-bazel
      with:
        buildbuddy-api-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.BUILDBUDDY_API_KEY
          || '' }}
    - name: Install Playwright Chromium
      run: bazel run //ui:playwright -- install --with-deps chromium
    - name: Check Docker daemon
      run: docker info
    - name: Run live session reconciliation and screenshot E2E
      run: bazel test //ui:e2e --test_arg=--grep --test_arg="Live session reconciliation|@screenshots" --test_env=CI=true
        --test_env=TESTCONTAINERS_RYUK_DISABLED=true
    - name: Upload Sightline screenshots
      id: upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sightline-e2e-screenshots
        path: bazel-testlogs/ui/e2e/test.outputs/*.png
        if-no-files-found: error
        retention-days: 14
    - name: Upload dark preview screenshot
      id: upload-preview
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sightline-e2e-dark-preview
        path: bazel-testlogs/ui/e2e/test.outputs/sightline-chat-dark.png
        if-no-files-found: error
        retention-days: 14
  python_e2e:
    name: Python E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-bazel
      with:
        buildbuddy-api-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.BUILDBUDDY_API_KEY
          || '' }}
    - name: Check Docker daemon
      run: docker info
    - name: Run Python E2E suite
      run: bazel test //tests:e2e_tests --test_env=TESTCONTAINERS_RYUK_DISABLED=true
  binary_artifacts:
    name: Binary Artifacts
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs:
    - bazel
    - runtime_image
    - ui
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          artifact_name: linux-x86_64
          sdk_platform: linux-x64
        - os: macos-15
          artifact_name: darwin-arm64
          sdk_platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    environment: desktop
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-bazel
      with:
        buildbuddy-api-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.BUILDBUDDY_API_KEY
          || '' }}
    - name: Build release archives
      run: bazel build --action_env=TALON_GOOGLE_CLIENT_ID --action_env=TALON_GOOGLE_CLIENT_SECRET //:release-dist
      env:
        TALON_GOOGLE_CLIENT_ID: ${{ secrets.TALON_GOOGLE_CLIENT_ID }}
        TALON_GOOGLE_CLIENT_SECRET: ${{ secrets.TALON_GOOGLE_CLIENT_SECRET }}
    - name: Stage release archives
      run: |-
        mkdir -p dist
        cp -R bazel-bin/release-dist/. dist/
        mv "dist/talon-${{ matrix.artifact_name }}.tar.gz" "dist/talon-${{ matrix.artifact_name }}-${GITHUB_SHA}.tar.gz"
    - name: Upload binary artifact bundle
      uses: actions/upload-artifact@v4
      with:
        name: talon-${{ matrix.artifact_name }}-${{ github.sha }}
        path: |
          dist/talon-${{ matrix.artifact_name }}-${{ github.sha }}.tar.gz
          dist/talon-${{ matrix.artifact_name }}/SHA256SUMS
          dist/talon-node-${{ matrix.sdk_platform }}.tar.gz
          dist/talon-node-${{ matrix.sdk_platform }}.tar.gz.sha256
        if-no-files-found: error
        retention-days: 14
'on':
  pull_request: null
  push:
    branches:
    - main
