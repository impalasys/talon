name: Talon OSS CI
# This workflow relays data and publishes; all Linux validation is in BuildBuddy.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: talon-artifacts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  artifacts:
    name: Collect verified BuildBuddy artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: read
      statuses: read
      pull-requests: read
    outputs:
      images: ${{ steps.fetch.outputs.images }}
      storybook: ${{ steps.fetch.outputs.storybook }}
      sightline: ${{ steps.fetch.outputs.sightline_static_export }}
      head: ${{ steps.fetch.outputs.head }}
    steps:
      # Never check out or execute PR code in this credential-bearing job.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Retrieve exact-revision BuildBuddy outputs
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 scripts/ci/fetch_ci_artifacts.py --output "$RUNNER_TEMP/buildbuddy"
      - uses: actions/upload-artifact@v4
        with:
          name: buildbuddy-metadata
          path: ${{ runner.temp }}/buildbuddy/pr.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.fetch.outputs.images == 'true'
        with:
          name: linux-ci-images
          path: ${{ runner.temp }}/buildbuddy/images/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.fetch.outputs.release == 'true'
        with:
          name: linux-ci-release-archives
          path: ${{ runner.temp }}/buildbuddy/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.fetch.outputs.storybook == 'true'
        with:
          name: talon-chat-storybook
          path: ${{ runner.temp }}/buildbuddy/storybook/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.fetch.outputs.sightline_static_export == 'true'
        with:
          name: sightline-static-export
          path: ${{ runner.temp }}/buildbuddy/sightline-static-export/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.fetch.outputs.sightline_e2e_screenshots == 'true'
        with:
          name: sightline-e2e-screenshots
          path: ${{ runner.temp }}/buildbuddy/sightline-e2e-screenshots/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: steps.fetch.outputs.sightline_e2e_dark_preview == 'true'
        with:
          name: sightline-e2e-dark-preview
          path: ${{ runner.temp }}/buildbuddy/sightline-e2e-dark-preview/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: steps.fetch.outputs.talon_chat_storybook_screenshots == 'true'
        with:
          name: talon-chat-storybook-screenshots
          path: ${{ runner.temp }}/buildbuddy/talon-chat-storybook-screenshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.fetch.outputs.benchmark == 'true'
        with:
          name: talon-1vcpu-benchmark-${{ steps.fetch.outputs.head }}
          path: ${{ runner.temp }}/buildbuddy/benchmark/
          if-no-files-found: error

  images:
    name: Publish verified OCI images
    if: github.event_name == 'push' && needs.artifacts.outputs.images == 'true'
    needs: artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-ci-images
          path: images
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tested image bytes
        env:
          COMMIT: ${{ needs.artifacts.outputs.head }}
        run: |
          set -euo pipefail
          for image in runtime ui acp; do docker load -i "images/$image.tar"; done
          publish() {
            for tag in latest "sha-$COMMIT"; do
              docker tag "$1" "ghcr.io/impalasys/$2:$tag"
              docker push "ghcr.io/impalasys/$2:$tag"
            done
          }
          publish talon-runtime:dev talon-runtime
          publish talon-ui:dev talon-ui
          for repository in talon-acp-harness talon-codex-acp talon-claude-code-acp talon-opencode-acp; do
            publish talon-acp-harness:local "$repository"
          done

  sightline:
    name: Deploy verified Sightline export
    if: github.event_name == 'push' && needs.artifacts.outputs.sightline == 'true'
    needs: artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sightline-static-export
          path: ui/dist
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          standalone: true
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT: ${{ needs.artifacts.outputs.head }}
        run: pnpm dlx wrangler@4 pages deploy ui/dist --project-name=talon-sightline --branch=main --commit-hash="$COMMIT" --commit-dirty=true

  chromatic:
    name: Publish verified Storybook
    if: needs.artifacts.outputs.storybook == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: artifacts
    runs-on: ubuntu-24.04
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: talon-chat-storybook
          path: packages/talon-chat/storybook-static
      - uses: chromaui/action@latest
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        with:
          projectToken: ${{ env.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/talon-chat
          storybookBuildDir: storybook-static
  linux_release:
    name: Linux Release Archives
    if: github.event_name == 'push'
    needs: artifacts
    runs-on: ubuntu-24.04
    environment: desktop
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-bazel
      with:
        # Keep the existing native bucket warm while other jobs consolidate.
        disk-cache: talon-bazel-Talon OSS CI-binary_artifacts
        cache-save: true
        buildbuddy-api-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.BUILDBUDDY_API_KEY
          || '' }}
    - name: Build release archives
      run: |
        options=()
        if [[ -n "$TALON_GOOGLE_CLIENT_ID" ]]; then options+=(--action_env=TALON_GOOGLE_CLIENT_ID); fi
        if [[ -n "$TALON_GOOGLE_CLIENT_SECRET" ]]; then options+=(--action_env=TALON_GOOGLE_CLIENT_SECRET); fi
        bazel build "${options[@]}" //:release-dist
        bazel test "${options[@]}" //tools/bazel:release_archives_test
      env:
        TALON_GOOGLE_CLIENT_ID: ${{ secrets.TALON_GOOGLE_CLIENT_ID }}
        TALON_GOOGLE_CLIENT_SECRET: ${{ secrets.TALON_GOOGLE_CLIENT_SECRET }}
    - name: Stage release archives
      run: |-
        mkdir -p dist
        cp -R bazel-bin/release-dist/. dist/
        mv "dist/talon-linux-x86_64.tar.gz" "dist/talon-linux-x86_64-${GITHUB_SHA}.tar.gz"
        mv dist/node.sha256 "dist/talon-node-linux-x64.tar.gz.sha256"
    - name: Verify native npm release archive
      env:
        SDK_PLATFORM: linux-x64
      run: |
        package="sdk/js/talon-node-${SDK_PLATFORM}"
        staging="$(mktemp -d)"
        tar -xzf "dist/talon-node-${SDK_PLATFORM}.tar.gz" -C "$staging"
        mkdir -p "${package}/bin"
        install -m 755 "$staging/talon-node-${SDK_PLATFORM}/talon-node" "${package}/bin/talon-node"
        bazel build "//${package}:archive"
        python3 - <<'PY'
        import os
        from pathlib import Path
        import tarfile

        package = Path("sdk/js") / ("talon-node-" + os.environ["SDK_PLATFORM"])
        with tarfile.open(Path("bazel-bin") / package / "pkg.tgz") as archive:
            binary = archive.getmember("package/bin/talon-node")
            assert binary.isfile() and binary.mode & 0o111, "npm binary must be executable"
            assert archive.extractfile(binary).read() == (package / "bin/talon-node").read_bytes()
            archive.getmember("package/index.js")
            archive.getmember("package/package.json")
        PY
    - name: Upload binary artifact bundle
      uses: actions/upload-artifact@v4
      with:
        name: talon-linux-x86_64-${{ github.sha }}
        path: |
          dist/talon-linux-x86_64-${{ github.sha }}.tar.gz
          dist/SHA256SUMS
          dist/talon-node-linux-x64.tar.gz
          dist/talon-node-linux-x64.tar.gz.sha256
        if-no-files-found: error
        retention-days: 14
