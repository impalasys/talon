name: Talon OSS CI
concurrency:
  group: talon-oss-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Skipped manual-run jobs must not replace the real PR check contexts.
  bazel:
    if: github.event_name != 'workflow_dispatch'
    name: ${{ github.event_name == 'workflow_dispatch' && 'Cache probe / ' || '' }}Bazel
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-bazel
      with:
        buildbuddy-api-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.BUILDBUDDY_API_KEY
          || '' }}
    - name: Build and test all unit targets
      run: bazel test //...
  runtime_image:
    if: github.event_name != 'workflow_dispatch'
    name: ${{ github.event_name == 'workflow_dispatch' && 'Cache probe / ' || '' }}Runtime Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-bazel
      with:
        buildbuddy-api-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.BUILDBUDDY_API_KEY
          || '' }}
    - name: Log in to GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and publish OCI image
      run: |
        bazel build //dockerfiles:runtime
        bazel run //dockerfiles:runtime_image
        docker run --rm talon-runtime:dev sh -ec 'talon-cli --help >/dev/null; python3 -c "import pytest, grpc, boto3"; monty --help >/dev/null; docker --version; curl --version'
        if [[ "$PUBLISH_IMAGE" == "true" ]]; then
          bazel run //dockerfiles:runtime_push -- --tag latest --tag "sha-${GITHUB_SHA}"
        fi
      env:
        PUBLISH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  acp_harness_image:
    if: github.event_name != 'workflow_dispatch'
    name: ${{ github.event_name == 'workflow_dispatch' && 'Cache probe / ' || '' }}ACP Harness Sandbox Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-bazel
      with:
        buildbuddy-api-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.BUILDBUDDY_API_KEY
          || '' }}
    - uses: docker/setup-buildx-action@v4
    - name: Log in to GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Package Bazel-built image
      run: |
        options=()
        if [[ "$PUBLISH_IMAGE" == "true" ]]; then options+=(--push); fi
        bazel run //dockerfiles:acp_image -- "${options[@]}" \
          --tag "ghcr.io/impalasys/talon-acp-harness:latest" \
          --tag "ghcr.io/impalasys/talon-acp-harness:sha-${{ github.sha }}" \
          --tag "ghcr.io/impalasys/talon-codex-acp:latest" \
          --tag "ghcr.io/impalasys/talon-codex-acp:sha-${{ github.sha }}" \
          --tag "ghcr.io/impalasys/talon-claude-code-acp:latest" \
          --tag "ghcr.io/impalasys/talon-claude-code-acp:sha-${{ github.sha }}" \
          --tag "ghcr.io/impalasys/talon-opencode-acp:latest" \
          --tag "ghcr.io/impalasys/talon-opencode-acp:sha-${{ github.sha }}" \
          --cache-from type=gha,scope=talon-acp-harness \
          --cache-to type=gha,mode=max,scope=talon-acp-harness
      env:
        PUBLISH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  ui:
    if: github.event_name != 'workflow_dispatch'
    name: ${{ github.event_name == 'workflow_dispatch' && 'Cache probe / ' || '' }}UI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-bazel
      with:
        buildbuddy-api-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.BUILDBUDDY_API_KEY
          || '' }}
    - name: Log in to GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and publish OCI image
      run: |
        bazel build //dockerfiles:ui
        if [[ "$PUBLISH_IMAGE" == "true" ]]; then
          bazel run //dockerfiles:ui_push -- --tag latest --tag "sha-${GITHUB_SHA}"
        fi
      env:
        PUBLISH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  sightline_e2e_screenshots:
    if: github.event_name != 'workflow_dispatch'
    name: ${{ github.event_name == 'workflow_dispatch' && 'Cache probe / ' || '' }}Sightline E2E Screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-bazel
      with:
        buildbuddy-api-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.BUILDBUDDY_API_KEY
          || '' }}
    - name: Install Playwright Chromium
      run: bazel run //ui:playwright -- install --with-deps chromium
    - name: Check Docker daemon
      run: docker info
    - name: Run live session reconciliation and screenshot E2E
      run: bazel test //ui:e2e --test_arg=--grep --test_arg="Live session reconciliation|@screenshots" --test_env=CI=true
        --test_env=TESTCONTAINERS_RYUK_DISABLED=true
    - name: Upload Sightline screenshots
      id: upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sightline-e2e-screenshots
        path: bazel-testlogs/ui/e2e/test.outputs/*.png
        if-no-files-found: error
        retention-days: 14
    - name: Upload dark preview screenshot
      id: upload-preview
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sightline-e2e-dark-preview
        path: bazel-testlogs/ui/e2e/test.outputs/sightline-chat-dark.png
        if-no-files-found: error
        retention-days: 14
  python_e2e:
    if: github.event_name != 'workflow_dispatch'
    name: ${{ github.event_name == 'workflow_dispatch' && 'Cache probe / ' || '' }}Python E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-bazel
      with:
        buildbuddy-api-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.BUILDBUDDY_API_KEY
          || '' }}
    - name: Check Docker daemon
      run: docker info
    - name: Run Python E2E suite
      run: bazel test //tests:e2e_tests --test_env=TESTCONTAINERS_RYUK_DISABLED=true
  binary_artifacts:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Cache probe / ' || '' }}Binary Artifacts (${{ matrix.os }}, ${{ matrix.artifact_name }}, ${{ matrix.sdk_platform }})
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs:
    - bazel
    - runtime_image
    - ui
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          artifact_name: linux-x86_64
          sdk_platform: linux-x64
        - os: macos-15
          artifact_name: darwin-arm64
          sdk_platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    environment: desktop
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-bazel
      with:
        buildbuddy-api-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.BUILDBUDDY_API_KEY
          || '' }}
    - name: Build release archives
      run: |
        options=()
        if [[ -n "$TALON_GOOGLE_CLIENT_ID" ]]; then options+=(--action_env=TALON_GOOGLE_CLIENT_ID); fi
        if [[ -n "$TALON_GOOGLE_CLIENT_SECRET" ]]; then options+=(--action_env=TALON_GOOGLE_CLIENT_SECRET); fi
        bazel build "${options[@]}" //:release-dist
        bazel test "${options[@]}" //tools/bazel:release_archives_test
      env:
        TALON_GOOGLE_CLIENT_ID: ${{ secrets.TALON_GOOGLE_CLIENT_ID }}
        TALON_GOOGLE_CLIENT_SECRET: ${{ secrets.TALON_GOOGLE_CLIENT_SECRET }}
    - name: Stage release archives
      run: |-
        mkdir -p dist
        cp -R bazel-bin/release-dist/. dist/
        mv "dist/talon-${{ matrix.artifact_name }}.tar.gz" "dist/talon-${{ matrix.artifact_name }}-${GITHUB_SHA}.tar.gz"
        mv dist/node.sha256 "dist/talon-node-${{ matrix.sdk_platform }}.tar.gz.sha256"
    - name: Upload binary artifact bundle
      uses: actions/upload-artifact@v4
      with:
        name: talon-${{ matrix.artifact_name }}-${{ github.sha }}
        path: |
          dist/talon-${{ matrix.artifact_name }}-${{ github.sha }}.tar.gz
          dist/SHA256SUMS
          dist/talon-node-${{ matrix.sdk_platform }}.tar.gz
          dist/talon-node-${{ matrix.sdk_platform }}.tar.gz.sha256
        if-no-files-found: error
        retention-days: 14
  buildbuddy_cache_probe:
    name: BuildBuddy Cache Verification
    # Only repository writers can dispatch this job. PR events never receive
    # the writer credential, including PRs originating from forks.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-bazel
      with:
        buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
    - name: Verify remote write and independent read
      shell: bash
      run: |
        test -s .bazelrc.local || { echo 'BUILDBUDDY_API_KEY is missing'; exit 1; }
        printf 'Run %s/%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> tools/bazel/cache_probe/input.txt
        options=(--disk_cache= --color=no --curses=no --remote_download_outputs=all)
        bazel --output_base="$RUNNER_TEMP/buildbuddy-write" build "${options[@]}" \
          --noremote_accept_cached --remote_upload_local_results=true \
          //tools/bazel/cache_probe:action 2>&1 | tee "$RUNNER_TEMP/buildbuddy-write.log"
        bazel --output_base="$RUNNER_TEMP/buildbuddy-read" build "${options[@]}" \
          --remote_accept_cached --remote_upload_local_results=false \
          //tools/bazel/cache_probe:action 2>&1 | tee "$RUNNER_TEMP/buildbuddy-read.log"
        grep -Eq '[1-9][0-9]* remote cache hit' "$RUNNER_TEMP/buildbuddy-read.log"
        cmp tools/bazel/cache_probe/input.txt bazel-bin/tools/bazel/cache_probe/output.txt
    - name: Upload cache verification logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: buildbuddy-cache-verification
        path: ${{ runner.temp }}/buildbuddy-*.log
        if-no-files-found: error
'on':
  workflow_dispatch:
  pull_request: null
  push:
    branches:
    - main
