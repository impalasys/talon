name: Talon Sightline (Cloudflare)
concurrency:
  group: talon-sightline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CLOUDFLARE_PROJECT_NAME: talon-sightline
jobs:
  build:
    name: Build Sightline
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-bazel
      with:
        buildbuddy-api-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.BUILDBUDDY_API_KEY
          || '' }}
    - name: Test Sightline
      run: bazel test //ui:unit_tests //ui:typecheck
    - name: Build Sightline static export
      run: bazel build --define=GATEWAY_URL=https://talon.impala.systems //ui:dist
    - name: Upload static export
      uses: actions/upload-artifact@v6
      with:
        name: sightline-static-export
        path: bazel-bin/ui/dist
        if-no-files-found: error
  deploy:
    name: Deploy Sightline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - name: Download static export
      uses: actions/download-artifact@v7
      with:
        name: sightline-static-export
        path: ui/dist
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10.17.1
    - name: Deploy to Cloudflare Pages
      run: |
        pnpm dlx wrangler@4 pages deploy ui/dist \
          --project-name="${CLOUDFLARE_PROJECT_NAME}" \
          --branch=main \
          --commit-hash="${GITHUB_SHA}" \
          --commit-dirty=true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
'on':
  pull_request:
    paths:
    - ui/**
    - .github/workflows/talon-sightline-cloudflare.yml
  push:
    branches:
    - main
    paths:
    - ui/**
    - .github/workflows/talon-sightline-cloudflare.yml
  workflow_dispatch: null
