name: Set up Talon Bazel
description: Install Bazel, native prerequisites, and optional trusted BuildBuddy access
inputs:
  buildbuddy-api-key:
    description: Cache writer credential; pass only on trusted main-branch builds
    required: false
    default: ''
  disk-cache:
    description: Shared build cache, or a separate native release cache
    required: false
    default: talon-build
  cache-save:
    description: Publish snapshots only from the canonical build and native release jobs
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: bazel-contrib/setup-bazel@0.19.2
      with:
        bazelisk-cache: true
        # One producer per bucket avoids both first-writer races and duplicate
        # snapshots evicting the native release caches under GitHub's quota.
        disk-cache: ${{ inputs.disk-cache }}
        cache-save: ${{ inputs.cache-save }}
        repository-cache: true
    - name: Install Linux native prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends pkg-config libssl-dev clang libclang-dev cmake
    - name: Configure trusted remote caching
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ inputs.buildbuddy-api-key }}
      run: |
        if [[ -n "$BUILDBUDDY_API_KEY" ]]; then
          umask 077
          printf 'build --config=buildbuddy\nbuild --remote_header=x-buildbuddy-api-key=%s\nbuild --bes_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" "$BUILDBUDDY_API_KEY" > .bazelrc.local
        fi
