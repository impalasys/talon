[package]
name = "talon-sandbox"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow =  "1.0"
async-trait =  "0.1"
base64 =  "0.21"
chrono =  { version = "0.4", features = ["serde"] }
futures =  "0.3"
reqwest =  { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde =  { version = "1.0", features = ["derive"] }
serde_json =  "1.0"
tokio =  { version = "1.0", features = ["full"] }
urlencoding =  "2.1"
talon-config = { path = "../talon-config" }
talon-contracts = { path = "../talon-contracts" }
talon-control = { path = "../talon-control" }
talon-identifiers = { path = "../talon-identifiers" }
talon-protocol = { path = "../talon-protocol" }
talon-security = { path = "../talon-security" }

[dev-dependencies]
talon-test-support = { path = "../talon-test-support" }
