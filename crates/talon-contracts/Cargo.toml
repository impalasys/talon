[package]
name = "talon-contracts"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow =  "1.0"
async-trait =  "0.1"
chrono =  { version = "0.4", features = ["serde"] }
futures =  "0.3"
prost =  "0.13"
serde =  { version = "1.0", features = ["derive"] }
serde_json =  "1.0"
sha2 =  "0.10"
talon-identifiers = { path = "../talon-identifiers" }
talon-protocol = { path = "../talon-protocol" }
