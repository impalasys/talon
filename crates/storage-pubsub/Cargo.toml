[package]
name = "storage-pubsub"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow =  "1.0"
async-stream =  "0.3"
async-trait =  "0.1"
base64 =  "0.21"
futures =  "0.3"
google-cloud-googleapis =  { version = "0.13.0", features = ["pubsub"] }
google-cloud-pubsub =  { version = "0.25.0", default-features = false, features = ["auth", "rustls-tls"] }
serde =  { version = "1.0", features = ["derive"] }
serde_json =  "1.0"
time =  "0.3"
tokio =  { version = "1.0", features = ["full"] }
tracing =  "0.1"
uuid =  { version = "1.23.0", features = ["v7"] }
contracts = { path = "../contracts" }

[dev-dependencies]
test-support = { path = "../test-support" }
tempfile =  "3.0"
tokio =  { version = "1.0", features = ["test-util"] }
