[package]
name = "talon-security"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow =  "1.0"
async-trait =  "0.1"
base64 =  "0.21"
bollard =  "0.20"
jsonwebtoken =  { version = "11.0", features = ["rust_crypto"] }
rustls =  { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde =  { version = "1.0", features = ["derive"] }
serde_json =  "1.0"
url =  "2"
talon-contracts = { path = "../talon-contracts" }

[dev-dependencies]
talon-test-support = { path = "../talon-test-support" }
