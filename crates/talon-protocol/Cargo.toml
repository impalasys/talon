[package]
name = "talon-protocol"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
prost = "0.13"
prost-types = "0.13"
serde = { version = "1.0", features = ["derive"] }
tonic = { version = "0.12.3", features = ["tls-webpki-roots"] }

[build-dependencies]
prost-build = "0.13"
tonic-build = "0.12.3"
