[package]
name = "fanout"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
async-stream =  "0.3"
futures =  "0.3"
tokio =  { version = "1.0", features = ["full"] }
tonic =  { version = "0.12.3", features = ["tls-webpki-roots"] }
protocol = { path = "../protocol" }

[dev-dependencies]
async-stream =  "0.3"
futures =  "0.3"
test-support = { path = "../test-support" }
