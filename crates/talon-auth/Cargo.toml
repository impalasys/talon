[package]
name = "talon-auth"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
axum =  { version = "0.7", features = ["ws"] }
serde =  { version = "1.0", features = ["derive"] }
serde_json =  "1.0"
sha2 =  "0.10"
tokio =  { version = "1.0", features = ["full"] }
tonic =  { version = "0.12.3", features = ["tls-webpki-roots"] }
tower =  "0.5"
url =  "2"
talon-protocol = { path = "../talon-protocol" }
talon-security = { path = "../talon-security" }

[dev-dependencies]
talon-test-support = { path = "../talon-test-support" }
