[package]
name = "talon-storage-objects"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow =  "1.0"
async-trait =  "0.1"
aws-config =  "1.8"
aws-sdk-s3 =  "1.103"
google-cloud-auth =  "1.8"
reqwest =  { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde =  { version = "1.0", features = ["derive"] }
serde_json =  "1.0"
time =  "0.3"
tokio =  { version = "1.0", features = ["full"] }
urlencoding =  "2.1"
talon-contracts = { path = "../talon-contracts" }
talon-protocol = { path = "../talon-protocol" }
talon-storage-memory = { path = "../talon-storage-memory" }

[dev-dependencies]
aws-smithy-runtime-api =  "1.11"
aws-smithy-types =  "1.4"
talon-test-support = { path = "../talon-test-support" }
tempfile =  "3.0"
tokio =  { version = "1.0", features = ["test-util"] }
