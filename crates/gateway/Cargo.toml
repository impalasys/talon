[package]
name = "gateway"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow =  "1.0"
async-stream =  "0.3"
async-trait =  "0.1"
axum =  { version = "0.7", features = ["ws"] }
base64 =  "0.21"
chrono =  { version = "0.4", features = ["serde"] }
futures =  "0.3"
hyper-util =  { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "service"] }
jsonwebtoken =  { version = "11.0", features = ["rust_crypto"] }
prost =  "0.13"
rand =  "0.10"
reqwest =  { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde =  { version = "1.0", features = ["derive"] }
serde_json =  "1.0"
sha2 =  "0.10"
tempfile =  "3.0"
tokio =  { version = "1.0", features = ["full"] }
tokio-stream =  { version = "0.1", features = ["net"] }
tokio-util =  { version = "0.7.18", features = ["rt"] }
tonic =  { version = "0.12.3", features = ["tls-webpki-roots"] }
tonic-web =  "0.12.3"
tower =  "0.5"
tower-http =  { version = "0.5", features = ["cors"] }
tracing =  "0.1"
url =  "2"
urlencoding =  "2.1"
uuid =  { version = "1.23.0", features = ["v7"] }
auth = { path = "../auth" }
config = { path = "../config" }
connectors = { path = "../connectors" }
contracts = { path = "../contracts" }
control = { path = "../control" }
identifiers = { path = "../identifiers" }
protocol = { path = "../protocol" }
security = { path = "../security" }

[dev-dependencies]
fanout = { path = "../fanout" }
session-control = { path = "../session-control" }
test-support = { path = "../test-support" }
tokio =  { version = "1.0", features = ["test-util"] }
