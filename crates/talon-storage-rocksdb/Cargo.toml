[package]
name = "talon-storage-rocksdb"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow =  "1.0"
async-trait =  "0.1"
rocksdb =  { version = "0.24", default-features = false, features = ["lz4", "bindgen-runtime"] }
time =  "0.3"
tokio =  { version = "1.0", features = ["full"] }
tracing =  "0.1"
talon-contracts = { path = "../talon-contracts" }
talon-storage-common = { path = "../talon-storage-common" }

[dev-dependencies]
talon-test-support = { path = "../talon-test-support" }
tempfile =  "3.0"
tokio =  { version = "1.0", features = ["test-util"] }
