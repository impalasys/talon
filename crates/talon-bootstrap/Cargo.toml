[package]
name = "talon-bootstrap"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[features]
aws = ["dep:talon-storage-dynamodb", "dep:talon-storage-eventbridge", "dep:talon-storage-sqs"]
rocksdb = ["dep:talon-storage-rocksdb"]

[dependencies]
talon-storage-common = { path = "../talon-storage-common" }

anyhow =  "1.0"
tokio =  { version = "1.0", features = ["full"] }
tracing =  "0.1"
talon-config = { path = "../talon-config" }
talon-contracts = { path = "../talon-contracts" }
talon-control = { path = "../talon-control" }
talon-identifiers = { path = "../talon-identifiers" }
talon-protocol = { path = "../talon-protocol" }
talon-storage-cloud-tasks = { path = "../talon-storage-cloud-tasks" }
talon-storage-memory = { path = "../talon-storage-memory" }
talon-storage-objects = { path = "../talon-storage-objects" }
talon-storage-postgres = { path = "../talon-storage-postgres" }
talon-storage-pubsub = { path = "../talon-storage-pubsub" }
talon-storage-sqlite = { path = "../talon-storage-sqlite" }

talon-storage-dynamodb = { path = "../talon-storage-dynamodb", optional = true }
talon-storage-eventbridge = { path = "../talon-storage-eventbridge", optional = true }
talon-storage-sqs = { path = "../talon-storage-sqs", optional = true }
talon-storage-rocksdb = { path = "../talon-storage-rocksdb", optional = true }
[dev-dependencies]
tempfile = "3.0"
talon-test-support = { path = "../talon-test-support" }
