[package]
name = "talon-config"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow =  "1.0"
async-trait =  "0.1"
aws-config =  "1.8"
aws-sdk-secretsmanager =  "1.103"
azure_identity =  { version = "0.33", default-features = false }
azure_security_keyvault_secrets =  { version = "0.12", default-features = false }
google-cloud-secretmanager-v1 =  "1.7"
prost =  "0.13"
serde =  { version = "1.0", features = ["derive"] }
serde_json =  "1.0"
serde_yaml =  "0.9"
tempfile =  "3.0"
tokio =  { version = "1.0", features = ["test-util"] }
toml =  "0.8"
talon-identifiers = { path = "../talon-identifiers" }
talon-protocol = { path = "../talon-protocol" }

[dev-dependencies]
talon-test-support = { path = "../talon-test-support" }
