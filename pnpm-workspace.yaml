packages:
  - "ui"
  - "docs-site"
  - "packages/*"
  - "sdk/js"
  - "sdk/js/*"
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd

packageExtensions:
  '@tailgrids/icons@2.0.0':
    dependencies:
      react: 19.2.3
