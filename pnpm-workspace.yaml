packages:
  - "dockerfiles/acp"
  - "ui"
  - "docs-site"
  - "packages/*"
  - "sdk/js"
  - "sdk/js/*"
  - "sdk/examples/js"
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd

packageExtensions:
  '@zed-industries/claude-code-acp@0.16.2':
    dependencies:
      zod: 4.4.3
  '@tailgrids/icons@2.0.0':
    dependencies:
      react: 19.2.3
