syntax = "proto3";

package talon.v1;

import "proto/data/data.proto";
import "proto/events.proto";

service SessionService {
  rpc Create(CreateSessionRequest) returns (SessionResponse);
  rpc Get(GetSessionRequest) returns (SessionResponse);
  rpc List(ListSessionsRequest) returns (ListSessionsResponse);
  rpc ListMessages(ListSessionMessagesRequest) returns (ListSessionMessagesResponse);
  rpc ListQueuedMessages(ListQueuedSessionMessagesRequest) returns (ListQueuedSessionMessagesResponse);
  rpc Delete(DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc Clear(ClearSessionRequest) returns (ClearSessionResponse);
  rpc Compact(CompactSessionRequest) returns (stream talon.events.SessionMessagePartEvent);
  rpc Doctor(DoctorSessionRequest) returns (DoctorSessionResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc AppendMessage(AppendSessionMessageRequest) returns (AppendSessionMessageResponse);
  rpc UpdateMessage(UpdateSessionMessageRequest) returns (UpdateSessionMessageResponse);
  rpc AnswerPermission(AnswerSessionPermissionRequest) returns (AnswerSessionPermissionResponse);
  rpc StopGeneration(StopSessionGenerationRequest) returns (StopSessionGenerationResponse);
  rpc StreamParts(StreamSessionPartsRequest) returns (stream talon.events.SessionMessagePartEvent);
  rpc StreamPartsBatch(StreamSessionPartsBatchRequest) returns (stream talon.events.SessionMessagePartEvent);
  rpc SubmitTurn(SubmitSessionTurnRequest) returns (stream talon.events.SessionMessagePartEvent);
  rpc ReadToolResultPart(ReadToolResultPartRequest) returns (ReadToolResultPartResponse);
}

message CreateSessionRequest {
  string agent = 1;
  string ns = 2;
  map<string, string> labels = 3;
}

message GetSessionRequest {
  reserved 5;
  reserved "step_limit";

  string session_id = 1;
  string agent = 2;
  string ns = 3;
  int32 message_limit = 4;
}

message ListSessionMessagesRequest {
  string session_id = 1;
  string agent = 2;
  string ns = 3;
  int32 page_size = 4;
  optional string before_message_id = 5;
}

message ListSessionMessagesResponseItem {
  reserved 2;
  reserved "steps";

  talon.data.SessionMessage message = 1;
}

message ListSessionMessagesResponse {
  string session_id = 1;
  string agent = 2;
  string state = 3;
  repeated ListSessionMessagesResponseItem items = 4;
  bool has_more = 5;
  optional string next_before_message_id = 6;
}

// Queue entries are stored separately from the canonical session transcript
// until they are dispatched. They are returned in FIFO dispatch order.
message ListQueuedSessionMessagesRequest {
  string session_id = 1;
  string agent = 2;
  string ns = 3;
  string queue = 4;
}

message QueuedSessionMessage {
  string entry_id = 1;
  talon.data.SessionMessage message = 2;
}

message ListQueuedSessionMessagesResponse {
  string session_id = 1;
  string agent = 2;
  string queue = 3;
  repeated QueuedSessionMessage entries = 4;
}

message ListSessionsRequest {
  string agent = 1;
  string ns = 2;
}

message SessionListItem {
  string session_id = 1;
  int64 updated_at = 2;
  map<string, string> labels = 3;
}

message ListSessionsResponse {
  repeated string session_ids = 1;
  repeated SessionListItem sessions = 2;
}

message SessionResponse {
  reserved 5;
  reserved "steps";

  string session_id = 1;
  string agent = 2;
  string state = 3;
  repeated talon.data.SessionMessage messages = 4;
  map<string, string> labels = 6;
  optional talon.data.TokenCounter context_tokens = 7;
}

message DeleteSessionRequest {
  string session_id = 1;
  string agent = 2;
  string ns = 3;
}

message DeleteSessionResponse {
  bool success = 1;
}

message ClearSessionRequest {
  string session_id = 1;
  string agent = 2;
  string ns = 3;
}

message ClearSessionResponse {
  bool success = 1;
}

message CompactSessionRequest {
  string session_id = 1;
  string agent = 2;
  string ns = 3;
}

message DoctorSessionRequest {
  string session_id = 1;
  string agent = 2;
  string ns = 3;
}

message DoctorSessionResponse {
  bool provider_continuation_was_present = 1;
  bool provider_continuation_reset = 2;
  uint32 incomplete_tool_batches = 3;
}

message SubmitSessionTurnRequest {
  string session_id = 1;
  string agent = 2;
  string ns = 3;
  talon.data.SessionMessage message = 4;
  map<string, string> labels = 5;
}

message SendMessageRequest {
  string session_id = 1;
  string agent = 2;
  string ns = 3;
  string message = 4;
  map<string, string> labels = 5;
}

message SendMessageResponse {
  string reply = 1;
  string session_id = 4;
}

message AppendSessionMessageRequest {
  string session_id = 1;
  string agent = 2;
  string ns = 3;
  talon.data.SessionMessage message = 4;
}

message AppendSessionMessageResponse {
  string session_id = 1;
  talon.data.SessionMessage message = 2;
}

message UpdateSessionMessageRequest {
  string session_id = 1;
  string agent = 2;
  string ns = 3;
  string message_id = 4;
  repeated talon.data.SessionMessagePart parts = 5;
  map<string, string> labels = 6;
}

message UpdateSessionMessageResponse {
  string session_id = 1;
  talon.data.SessionMessage message = 2;
}

message AnswerSessionPermissionRequest {
  string session_id = 1;
  string agent = 2;
  string ns = 3;
  string request_id = 4;
  string outcome = 5;
  string option_id = 6;
  string decided_by = 7;
}

message AnswerSessionPermissionResponse {
  string session_id = 1;
  string request_id = 2;
  string outcome = 3;
  string option_id = 4;
}

message StopSessionGenerationRequest {
  string session_id = 1;
  string agent = 2;
  string ns = 3;
}

message StopSessionGenerationResponse {
  bool success = 1;
}

message StreamSessionPartsRequest {
  string session_id = 1;
  string agent = 2;
  string ns = 3;
}

message StreamSessionPartsBatchRequest {
  repeated string session_names = 1;
}

// Reads one session-local tool-result content part. CAS object keys are never
// accepted from clients; the service resolves the part through the session
// transcript after normal session authorization.
message ReadToolResultPartRequest {
  string session_id = 1;
  string agent = 2;
  string ns = 3;
  string tool_call_id = 4;
  uint32 part_index = 5;
  ToolResultByteRange byte_range = 6;
}

// Matches the generic read tool's byte_range contract. `end` is exclusive;
// exactly one of `end` and `max_size` must be supplied.
message ToolResultByteRange {
  uint64 start = 1;
  oneof limit {
    uint64 end = 2;
    uint64 max_size = 3;
  }
}

message ReadToolResultPartResponse {
  string media_type = 1;
  uint64 start = 2;
  uint64 end = 3;
  optional uint64 next_byte = 4;
  oneof content {
    string text = 5;
    talon.data.ObjectRef object = 6;
  }
}
