syntax = "proto3";

package talon.harness;

import "proto/data/data.proto";
import "proto/resources/agents.proto";

message ChatContentPart {
  oneof content {
    string text = 1;
    talon.data.ObjectRef object_ref = 4;
  }
  reserved 2, 3;
}

message ToolOutput {
  repeated ChatContentPart content_parts = 1;
  string summary = 2;
  // Compact durable metadata for an object-backed result. This is deliberately
  // separate from summary: callers render summary for people, while runtimes
  // use this structure to reproduce a bounded view without copying bytes.
  optional ToolOutputContentDescriptor content_descriptor = 3;
}

message ToolOutputLineSelection {
  // One-based, inclusive line bounds in the referenced text object.
  uint64 start_line = 1;
  uint64 end_line = 2;
}

// A zero-based, half-open byte range in a UTF-8 text object.  `end` is the
// actual end returned to the caller; `next_byte` is set for bounded reads
// when more logical bytes remain.
message ToolOutputByteRange {
  uint64 start = 1;
  uint64 end = 2;
  optional uint64 next_byte = 3;
}

message ToolOutputContentDescriptor {
  // The referenced object can be reread in bounded sections.
  bool section_readable = 1;
  // Logical bytes retained in the referenced object, before CAS compression.
  uint64 captured_size_bytes = 2;
  // Number of logical text lines retained in the referenced object.
  uint64 line_count = 3;
  // Source output exceeded the capture ceiling, so bytes after the retained
  // object are unavailable.
  bool capture_truncated = 4;
  // Present when this output is a view over a selected section of another
  // immutable object rather than a new copied result.
  optional ToolOutputLineSelection selection = 5;
  // New selections use bytes. Keep `selection` above for journals written by
  // older Talon releases.
  optional ToolOutputByteRange byte_range = 6;
}

message ToolCall {
  string id = 1;
  string name = 2;
  // Provider-native JSON argument string.
  string arguments = 3;
}

message ToolCallDelta {
  uint32 index = 1;
  optional string id = 2;
  optional string name = 3;
  optional string arguments = 4;
}

message ChatMessage {
  string role = 1;
  repeated ChatContentPart content_parts = 2;
  repeated ToolCall tool_calls = 3;
  optional string tool_call_id = 4;
  // Opaque provider continuation state associated with this assistant message.
  optional talon.data.ObjectRef encrypted_reasoning = 5;
}

message ChatResponse {
  string content = 1;
  repeated ToolCall tool_calls = 2;
  optional talon.data.TokenCounter usage = 3;
  // Opaque provider continuation state stored in CAS.
  optional talon.data.ObjectRef encrypted_reasoning = 4;
}

message Tool {
  string name = 1;
  string description = 2;
  // JSON Schema encoded as a stable provider-neutral JSON string.
  string input_schema_json = 3;
}

message ChatRequest {
  repeated ChatMessage messages = 1;
  repeated Tool tools = 2;
  optional talon.resources.ThinkingConfig thinking = 3;
  optional string previous_response_id = 4;
  bool zero_data_retention = 5;
}

message ChatStreamEvent {
  oneof event {
    string text_delta = 1;
    string reasoning_delta = 2;
    ToolCallDelta tool_call_delta = 3;
    talon.data.TokenCounter usage = 4;
    // Raw opaque provider state. The executor writes it to CAS before it is
    // persisted in a ChatResponse or SessionMessage.
    string encrypted_reasoning = 5;
  }
}
