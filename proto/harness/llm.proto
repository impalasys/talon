syntax = "proto3";

package talon.harness;

import "proto/data/data.proto";
import "proto/resources/agents.proto";

// Half-open byte interval [start, end) selecting a slice of a tool-result
// part's UTF-8 text. Endpoints are byte offsets within the part's text and
// must lie on UTF-8 character boundaries. Part-level so nested selections
// compose by interval arithmetic.
message ByteRange {
  uint64 start = 1;
  uint64 end = 2;
}

message ChatContentPart {
  oneof content {
    string text = 1;
    talon.data.ObjectRef object_ref = 4;
  }
  reserved 2, 3;
  // Half-open byte interval [start, end) within this part's UTF-8 text.
  // Valid only for inline text or a text-media-type object_ref; endpoints
  // must be UTF-8 character boundaries. A range on a non-text part is
  // rejected, never silently ignored.
  optional ByteRange byte_range = 5;
}

// Deprecated page receipt: records the byte range requested for a
// ToolOutput read (requested start/end, plus next_byte to continue the
// read). Must never be used to select bytes during materialization.
message ToolOutputByteRange {
  uint64 start = 1;
  uint64 end = 2;
  optional uint64 next_byte = 3;
}

message ToolOutput {
  repeated ChatContentPart content_parts = 1;
  string summary = 2;
  // Deprecated page receipt: records the requested range for a read.
  // Must never be used to select bytes during materialization; the
  // part-level ByteRange fields are the authoritative selection.
  optional ToolOutputByteRange byte_range = 3 [deprecated = true];
}

message ToolCall {
  string id = 1;
  string name = 2;
  // Provider-native JSON argument string.
  string arguments = 3;
}

message ToolCallDelta {
  uint32 index = 1;
  optional string id = 2;
  optional string name = 3;
  optional string arguments = 4;
}

message ChatMessage {
  string role = 1;
  repeated ChatContentPart content_parts = 2;
  repeated ToolCall tool_calls = 3;
  optional string tool_call_id = 4;
  // Opaque provider continuation state associated with this assistant message.
  optional talon.data.ObjectRef encrypted_reasoning = 5;
}

message ChatResponse {
  string content = 1;
  repeated ToolCall tool_calls = 2;
  optional talon.data.TokenCounter usage = 3;
  // Opaque provider continuation state stored in CAS.
  optional talon.data.ObjectRef encrypted_reasoning = 4;
}

message Tool {
  string name = 1;
  string description = 2;
  // JSON Schema encoded as a stable provider-neutral JSON string.
  string input_schema_json = 3;
}

message ChatRequest {
  repeated ChatMessage messages = 1;
  repeated Tool tools = 2;
  optional talon.resources.ThinkingConfig thinking = 3;
  optional string previous_response_id = 4;
  bool zero_data_retention = 5;
}

message ChatStreamEvent {
  oneof event {
    string text_delta = 1;
    string reasoning_delta = 2;
    ToolCallDelta tool_call_delta = 3;
    talon.data.TokenCounter usage = 4;
    // Raw opaque provider state. The executor writes it to CAS before it is
    // persisted in a ChatResponse or SessionMessage.
    string encrypted_reasoning = 5;
  }
}
