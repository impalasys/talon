syntax = "proto3";

package talon.harness;

import "proto/data/data.proto";
import "proto/resources/agents.proto";

message ChatContentPart {
  oneof content {
    string text = 1;
    talon.data.ObjectRef object_ref = 4;
    EncryptedReasoning encrypted_reasoning = 5;
  }
  reserved 2, 3;
}

// Opaque provider-native reasoning content that must be replayed unchanged.
// The raw JSON is intentionally not exposed as ordinary text content.
message EncryptedReasoning {
  string provider = 1;
  string block_type = 2;
  bytes raw_json = 3;
}

message ToolOutput {
  repeated ChatContentPart content_parts = 1;
  string summary = 2;
}

message ToolCall {
  string id = 1;
  string name = 2;
  // Provider-native JSON argument string.
  string arguments = 3;
}

message ToolCallDelta {
  uint32 index = 1;
  optional string id = 2;
  optional string name = 3;
  optional string arguments = 4;
}

message ChatMessage {
  string role = 1;
  repeated ChatContentPart content_parts = 2;
  repeated ToolCall tool_calls = 3;
  optional string tool_call_id = 4;
  reserved 5;
  reserved "provider_state_json";
}

message ChatResponse {
  string content = 1;
  repeated ToolCall tool_calls = 2;
  optional talon.data.TokenCounter usage = 3;
  repeated ChatContentPart content_parts = 5;
  reserved 4;
  reserved "provider_state_json";
}

message Tool {
  string name = 1;
  string description = 2;
  // JSON Schema encoded as a stable provider-neutral JSON string.
  string input_schema_json = 3;
}

message ChatRequest {
  repeated ChatMessage messages = 1;
  repeated Tool tools = 2;
  optional talon.resources.ThinkingConfig thinking = 3;
}

message ChatStreamEvent {
  oneof event {
    string text_delta = 1;
    string reasoning_delta = 2;
    ToolCallDelta tool_call_delta = 3;
    talon.data.TokenCounter usage = 4;
    ChatContentPart content_part = 6;
  }
  reserved 5;
  reserved "provider_state_json";
}
