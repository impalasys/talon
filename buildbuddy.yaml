actions:
  - name: Talon CI
    os: linux
    arch: amd64
    container_image: ubuntu-24.04
    bazel_use_cli: false
    resource_requests:
      cpu: 16
      memory: 32GB
      disk: 80GB
    timeout: 90m
    allow_concurrent_runs_on_branches: []
    triggers:
      push:
        branches: [main]
      pull_request:
        branches: [main]
        merge_with_base: true
    steps:
      - run: |
          set -euo pipefail
          bash scripts/ci/linux-build-setup.sh
          python3 scripts/ci/linux_build.py --output "$BUILDBUDDY_ARTIFACTS_DIRECTORY"
